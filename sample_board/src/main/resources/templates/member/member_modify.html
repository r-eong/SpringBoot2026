<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/home.css}">
<link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
<link rel="stylesheet" th:href="@{/css/common.css}">
<script type="@{/js/member.js}"></script>
</head>
<body>
	<header th:replace="~{/include/header_nav_footer.html::header}"></header>
	<nav th:replace="~{/include/header_nav_footer.html::nav}"></nav>
	
	<section>
		<div class="section_wrap">
			<h3 class="label_cell">마이페이지</h3>
			<div class="myPageMod">
				<form action="@{/member/modfiy}" method="POST">
					<table>
						<tbody>
							<tr>
								<th>아이디</th>
								<td>
									<input type="text" name="id" th:value="${member.id}" readonly="readonly" />
								</td>
							</tr>
							<tr>
								<th>이메일</th>
								<td>
									<input type="email" name="mail" th:value="${member.mail}" />
								</td>
							</tr>
							<tr>
								<th>휴대폰번호</th>
								<td>
									<input type="tel" name="phone" th:value="${member.phone}" />
								</td>
							</tr>
							<tr>
								<th>비밀번호 확인</th>
								<td>
									<input type="password" name="pw" required="required" 
									placeholder="비밀번호를 입력하세요." />
								</td>
							</tr>
						</tbody>
					</table>
				</form>
			</div>
			<div class="memberMod" style="margin-top: 20px;">
				<button type="submit" class="btn">수정완료</button>
			</div>
		</div>
	</section>
		
	<footer th:replace="~{/include/header_nav_footer.html::footer}"></footer>
	
	<script th:if="${msg}">
		alert('[[${msg}]]');
	</script>
</body>
</html>
