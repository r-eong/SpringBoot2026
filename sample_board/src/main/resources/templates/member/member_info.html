<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/home.css}">
<link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
<link rel="stylesheet" th:href="@{/css/common.css}">
<script type="@{/js/member.js}"></script>
</head>
<body>
	<header th:replace="~{/include/header_nav_footer.html::header}"></header>
	<nav th:replace="~{/include/header_nav_footer.html::nav}"></nav>
	
	<section>
		<div class="section_wrap">
			<h3 class="label_cell">마이페이지</h3>
			<div class="myPage">
				<table>
					<tbody>
						<tr>
							<th>아이디</th>
							<td th:text=${oneMember.id}></td>
						</tr>
						<tr>
							<th>이메일</th>
							<td th:text=${oneMember.mail}></td>
						</tr>
						<tr>
							<th>휴대폰번호</th>
							<td th:text=${oneMember.phone}></td>
						</tr>
						<tr>
							<th>등록일</th>
							<td th:text=${oneMember.reg_date}></td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="memberMod" style="margin-top: 20px;">
				<a th:href="@{/member/modify(id=${oneMember.id})}" class="btn">회원정보 수정</a>
				<a th:href="@{/member/delMember(id=${oneMember.id})}" class="btn white">회원탈퇴</a>
			</div>
		</div>
	</section>
		
	<footer th:replace="~{/include/header_nav_footer.html::footer}"></footer>
</body>
</html>
