<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/home.css}">
<link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
<link rel="stylesheet" th:href="@{/css/common.css}">
<script type="@{/js/member.js}"></script>
</head>
<body>
	<header th:replace="~{/include/header_nav_footer.html::header}"></header>
	<nav th:replace="~{/include/header_nav_footer.html::nav}"></nav>
	
	<section>
		<div class="section_wrap">
			<h3 class="label_cell">로그인</h3>
			<div class="login">
				<form th:action="@{/member/loginPro}" name="signup_form" method="POST">
					<table>
						<tbody>
							<tr>
								<td>아이디</td>
								<td>
									<input type="text" name="id" class="join_content" 
									placeholder="아이디를 입력하세요." required="required" />
								</td>
							</tr>
							<tr>
								<td>비밀번호</td>
								<td>
									<input type="password" name="pw" class="join_content" 
									placeholder="비밀번호를 입력하세요." required="required" />
								</td>
							</tr>
							<tr>
								<td colspan="2" class="login_btn_area">
									<input type="submit" value="로그인" class="btn" style="width: 120px;" />
									<input type="button" value="회원가입" style="width: 120px;" 
									th:onclick="|location.href='@{/member/signup}'" class="btn" />
								</td>
							</tr>
						</tbody>
					</table>
				</form>
			</div>
		</div>
	</section>
		
	<footer th:replace="~{/include/header_nav_footer.html::footer}"></footer>
</body>
</html>
