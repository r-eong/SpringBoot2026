<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.com">
<head>
<meta charset="UTF-8">
<title>리뷰 전체목록</title>
<style type="text/css">
	body {
	    background-color: #f4f7f6;
	    font-family: 'Pretendard', -apple-system, sans-serif;
	    margin: 0;
	    padding: 50px 0;
	    display: flex;
	    justify-content: center;
	}
	
	/* 전체 감싸는 div */
	body > div {
	    background: #fff;
	    width: 90%;
	    max-width: 950px;
	    padding: 40px;
	    border-radius: 15px;
	    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
	}
	
	h2 {
	    text-align: center;
	    color: #2c3e50;
	    margin-bottom: 30px;
	    font-weight: 600;
	}
	
	/* 글쓰기 버튼 (h2 다음에 오는 button) */
	h2 + button {
	    all: unset; /* 브라우저 기본 스타일 초기화 */
	    float: right;
	    padding: 10px 25px;
	    background-color: #2c3e50;
	    color: white;
	    border-radius: 8px;
	    cursor: pointer;
	    font-weight: 600;
	    font-size: 14px;
	    transition: all 0.2s ease;
	    margin-bottom: 20px;
	    text-align: center;
	}
	
	h2 + button:hover {
	    background-color: #1a252f;
	    transform: translateY(-1px);
	}
	
	table {
	    width: 100%;
	    border-collapse: collapse;
	    clear: both; /* 버튼 float 해제 */
	}
	
	/* 첫 번째 행 (헤더 역할) */
	tr:first-child td {
	    background-color: #f8f9fa;
	    color: #7f8c8d;
	    font-weight: 600;
	    border-bottom: 2px solid #edf2f7;
	}
	
	/* 일반 데이터 칸 */
	td {
	    padding: 15px;
	    border-bottom: 1px solid #f1f2f6;
	    color: #2f3640;
	    text-align: center;
	    font-size: 14px;
	    vertical-align: middle;
	}
	
	/* 제목이 들어가는 두 번째 칸(td) 왼쪽 정렬 */
	td:nth-child(2) {
	    text-align: left;
	}
	
	/* 제목 링크 스타일 */
	td:nth-child(2) a {
	    text-decoration: none;
	    color: #2c3e50;
	    font-weight: 500;
	    margin-left: 10px;
	}
	
	td:nth-child(2) a:hover {
	    color: #3498db;
	}
	
	/* 썸네일 이미지 스타일 */
	td img {
	    border-radius: 5px;
	    vertical-align: middle;
	    object-fit: cover;
	}
	
	/* 별점 span 스타일 */
	td span {
	    color: #f1c40f;
	    font-weight: bold;
	    letter-spacing: 1px;
	}
	
	/* 작성일자 칸 폰트 작게 */
	td:nth-child(5) {
	    color: #95a5a6;
	    font-size: 13px;
	}
</style>
</head>
<body>
	<div class="container">
		<h2>전체 게시글 목록</h2>
		<button type="button" class="btn-write" th:onclick="|location.href='@{/review/writer}'|">글쓰기</button>
		<table>
			<tr>
				<td>번호</td>
				<td>제목</td>
				<td>작성자</td>
				<td>별점</td>
				<td width="150" align="center">작성일자</td>
				<td>조회수</td>
			</tr>
			<tr th:each="li, stat:${reviewList}">
	        	<td th:text="${stat.size - stat.index}"></td>
				<td>
					<!-- 썸네일 이미지 -->
					<!-- 이미지 안 나옴 / 이유 : 모르겠음 -->
					<img th:if="${li.upload1 != null}" th:src="@{/upload/{img}(img=${li.upload1})}" 
					width="50" height="50" alt="첨부파일1">
			        <a th:href="@{/review/detail(num=${li.num})}" th:text="${li.subject}"></a>	
		        </td>
	            <td th:text="${li.writer}"></td>
		        <td>
		        	<!-- <span th:if="${li.stars == 1}">★</span> -->
		        	<!-- <span th:if="${li.stars == 2}">★★</span> -->
	                <span style="color: #f1c40f; font-weight: bold; margin-left: 5px;" 
	                      th:text="${#strings.repeat('★', li.stars)} + ' ' + ${li.stars}"></span>
					<!-- #strings : 타임리프 코드. 문자열 관리 객체. 문자열을 자르거나, 합치거나 반복할 때 사용.
                    	 .repeat('반복할문자', 횟수) -->
            	</td>
	          	<td th:text="${#dates.format(li.reg_date, 'yyyy-MM-dd HH:mm')}"></td>
				<td th:text="${li.readcount}"></td>
	        </tr>
	    </table>
	  </div>
</body>
</html>
