<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.com">
<head>
<meta charset="UTF-8">
<title>리뷰 상세페이지</title>
<style type="text/css">
	body {
		background-color: #f4f7f6;
		font-family: 'Pretendard', -apple-system, sans-serif;
		margin: 0;
		padding: 50px 0;
		display: flex;
		justify-content: center;
	}
	
	.container {
		background: #fff;
		width: 90%;
		max-width: 800px;
		padding: 40px;
		border-radius: 15px;
		box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
	}
	
	h2 {
		text-align: center;
		color: #2c3e50;
		margin-bottom: 20px;
		font-size: 26px;
	}
	
	/* 평균 별점 섹션 */
	.avg-section {
		text-align: center;
		background-color: #f8f9fa;
		padding: 20px;
		border-radius: 10px;
		margin-bottom: 30px;
		color: #7f8c8d;
		font-weight: 600;
	}
	
	.avg-section p {
		margin: 5px 0 0 0;
		font-size: 28px;
		color: #f1c40f;
	}
	
	table {
		width: 100%;
		border-collapse: collapse;
		table-layout: fixed; /* 테이블 너비 고정 */
	}
	
	td {
		padding: 15px 20px;
		border-bottom: 1px solid #f1f2f6;
		color: #2f3640;
		font-size: 15px;
		word-break: break-all;
	}
	
	td:nth-child(odd) {
		background-color: #f8f9fa;
		color: #7f8c8d;
		font-weight: 600;
		width: 100px;
		text-align: center;
	}
	
	.stars {
		color: #f1c40f;
		font-size: 18px;
		font-weight: bold;
	}
	
	/* 본문 영역 */
	.content-area {
		min-height: 200px;
		vertical-align: top !important;
		line-height: 1.8;
		white-space: pre-wrap;
	}
	
	/* 하단 버튼 및 폼 영역 */
	.btn-group {
		display: flex;
		justify-content: center;
		align-items: center;
		gap: 10px; /* 요소 간 간격 */
		padding-top: 30px;
		border-top: 2px solid #f4f7f6;
		margin-top: 20px;
	}
	
	/* 공통 버튼 기반 스타일 */
	.btn-group input[type="button"], 
	.btn-group input[type="submit"] {
	    display: inline-block;
	    padding: 10px 22px;
	    border-radius: 8px;
	    font-weight: 600;
	    font-size: 14px;
	    cursor: pointer;
	    text-align: center;
	    border: none;
	    line-height: 1;
	}
	
	/* 개별 버튼 색상 - 클래스 선택자를 더 강력하게 정의 */
	.btn-group .btn-list {
	    background-color: #95a5a6 !important;
	    color: #ffffff !important;
	}
	
	.btn-group .btn-edit {
	    background-color: #2c3e50 !important;
	    color: #ffffff !important;
	}
	
	.btn-group .btn-delete {
	    background-color: #e74c3c !important;
	    color: #ffffff !important;
	}
	
	/* 삭제 폼 내부 정렬 */
	.delete-form {
		display: flex;
		align-items: center;
		gap: 5px;
		margin: 0;
	}
	
	.input-pw {
		padding: 9px 12px;
		border: 1px solid #ddd;
		border-radius: 8px;
		font-size: 13px;
		outline: none;
	}
	
	.input-pw:focus {
		border-color: #2c3e50;
	}
</style>
</head>
<body>
	<div class="container">
		<h2>리뷰 상세보기</h2>
		<div class="avg-section">
			전체 평균 별점
			<p th:text="${#strings.repeat('★', averageStars)} + ${#strings.repeat('☆', 5 - averageStars)}"></p>
		</div>
		<table>
			<tr>
				<td>글번호</td>
				<td th:text="${onelist.num}"></td>
				<td>조회수</td>
				<td th:text="${onelist.readcount}"></td>
			</tr>
			<tr>
				<td>작성자</td>
				<td th:text="${onelist.writer}"></td>
				<td>작성일</td>
				<td th:text="${#dates.format(onelist.reg_date, 'yyyy-MM-dd HH:mm')}"></td>
			</tr>
			<tr>
				<td>별점</td>
				<td colspan="3"><span class="stars"
					th:text="${#strings.repeat('★', onelist.stars)}"></span></td>
			</tr>
			<tr>
				<td>이메일</td>
				<td colspan="3" th:text="${onelist.email}"></td>
			</tr>
			<tr>
				<td>제목</td>
				<td colspan="3" th:text="${onelist.subject}"></td>
			</tr>
			<tr>
				<td>글내용</td>
				<td colspan="3" th:text="${onelist.content}" class="content-area"></td>
			</tr>
		</table>
		<div class="btn-group">
		    <input type="button" th:onclick="|location.href='@{/review/list}'|" class="btn-list" value="목록보기">
		
			<!-- 수정 -->
		    <form th:action="@{/review/reWrite}" method="POST" style="display:inline;">
		        <input type="hidden" name="num" th:value="${onelist.num}">
		        <input type="submit" value="수정하기" class="btn-edit">
		    </form>
		    
		    <!-- 삭제 -->
		    <form th:action="@{/review/deletePro}" method="POST" class="delete-form" style="display:inline;">
		        <input type="hidden" name="num" th:value="${onelist.num}">
		        <input type="password" name="password" placeholder="비밀번호 확인" class="input-pw" required>
		        <input type="submit" value="삭제하기" class="btn-delete" onclick="return confirm('정말로 삭제하시겠습니까?');">
		    </form>
		</div>
	</div>
</body>
</html>
